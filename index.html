<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>収支管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      <h1>収支管理</h1>
      <div id="bookSwitcher" class="book-switcher">
        <select id="bookSelect" aria-label="家計簿を選択"></select>
        <button type="button" id="addBookBtn" class="icon-btn" title="家計簿を追加" aria-label="家計簿を追加">+</button>
        <button type="button" id="renameBookBtn" class="icon-btn" title="家計簿の名前を変更" aria-label="家計簿の名前を変更">✎</button>
        <button type="button" id="deleteBookBtn" class="icon-btn" title="家計簿を削除" aria-label="家計簿を削除">×</button>
      </div>
    </div>
    <div id="authStatus" class="auth-status"></div>
    <div id="headerActions" class="header-actions">
      <input type="search" id="searchInput" class="search-input" placeholder="🔍 メモを検索 ( / )" aria-label="メモを検索">
      <select id="filterTag" aria-label="タグで絞り込み">
        <option value="">全タグ</option>
      </select>
      <div class="amount-range" role="group" aria-label="金額で絞り込み">
        <input type="number" id="minAmount" min="1" max="99999999" step="1" inputmode="numeric" placeholder="¥ 下限" aria-label="金額の下限">
        <span aria-hidden="true">〜</span>
        <input type="number" id="maxAmount" min="1" max="99999999" step="1" inputmode="numeric" placeholder="¥ 上限" aria-label="金額の上限">
      </div>
      <select id="sortSelect" aria-label="並び替え">
        <option value="date">並び替え: 日付の新しい順</option>
        <option value="amount">並び替え: 金額の大きい順</option>
      </select>
      <button type="button" id="selectionModeBtn" class="btn-secondary" aria-pressed="false" title="取引を複数選択してまとめて削除します">☑ 選択</button>
      <!-- 使用頻度の低い設定・データ操作はメニューにまとめ、ヘッダーのボタン数を減らす -->
      <details id="moreMenu" class="menu">
        <summary class="btn-secondary">⚙ 設定・データ</summary>
        <div class="menu-panel">
          <button type="button" id="themeToggleBtn" class="btn-secondary"></button>
          <button type="button" id="exportBtn" class="btn-secondary">⬇ エクスポート</button>
          <button type="button" id="importBtn" class="btn-secondary">⬆ インポート</button>
          <p class="menu-hint">ショートカット: <kbd>N</kbd> 取引を追加 / <kbd>/</kbd> 検索 / <kbd>Esc</kbd> 閉じる</p>
        </div>
      </details>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      <button type="button" id="addTxnBtn" class="btn-primary" title="取引を追加 (N)">+ 取引を追加</button>
    </div>
  </header>

  <section id="monthBar" class="month-bar hidden" aria-label="表示する月と月の収支">
    <div class="month-nav">
      <button type="button" id="prevMonthBtn" class="icon-btn" aria-label="前の月">◀</button>
      <h2 id="monthLabel" class="month-label" aria-live="polite"></h2>
      <button type="button" id="nextMonthBtn" class="icon-btn" aria-label="次の月">▶</button>
      <button type="button" id="thisMonthBtn" class="btn-secondary month-today">今月</button>
    </div>
    <dl class="summary">
      <div class="summary-item income">
        <dt>収入</dt>
        <dd id="summaryIncome">¥0</dd>
      </div>
      <div class="summary-item expense">
        <dt>支出</dt>
        <dd id="summaryExpense">¥0</dd>
      </div>
      <div class="summary-item balance">
        <dt>残高</dt>
        <dd id="summaryBalance">¥0</dd>
      </div>
    </dl>
  </section>

  <div id="apiErrorBanner" class="api-error-banner hidden" role="alert">
    <span id="apiErrorMessage"></span>
    <button type="button" id="apiErrorDismiss" class="icon-btn" aria-label="閉じる">×</button>
  </div>

  <div id="selectionBar" class="selection-bar hidden" role="region" aria-label="取引の一括操作">
    <span id="selectionCount" class="selection-count" aria-live="polite"></span>
    <div class="selection-actions">
      <button type="button" id="selectAllVisibleBtn" class="btn-secondary">表示中をすべて選択</button>
      <button type="button" id="clearSelectionBtn" class="btn-secondary">選択解除</button>
      <button type="button" id="bulkDeleteBtn" class="btn-danger">選択した取引を削除</button>
      <button type="button" id="exitSelectionBtn" class="btn-secondary">終了</button>
    </div>
  </div>

  <div id="filterBar" class="filter-bar hidden" role="status">
    <span id="filterSummary"></span>
    <button type="button" id="clearFiltersBtn" class="btn-secondary">条件をクリア</button>
  </div>

  <main class="board" id="board"></main>

  <!-- スマホでは画面下に固定し、片手ですぐ記録できるようにする -->
  <button type="button" id="fabAddTxnBtn" class="fab hidden" aria-label="取引を追加">＋</button>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">取引を追加</h2>
      <form id="txnForm" novalidate>
        <div id="txnCreatedAt" class="txn-created hidden"></div>
        <label>金額(円)<span class="required">*</span>
          <input type="number" id="txnAmount" required min="1" max="99999999" step="1" inputmode="numeric" placeholder="例: 1280">
        </label>
        <div class="form-row">
          <label>日付<span class="required">*</span>
            <input type="date" id="txnDate" required>
          </label>
          <label>カテゴリ<span class="required">*</span>
            <select id="txnCategory" required></select>
          </label>
        </div>
        <label>メモ
          <input type="text" id="txnMemo" maxlength="100" placeholder="例: スーパーで食材">
        </label>
        <label>タグ<span class="hint">(カンマ区切り)</span>
          <input type="text" id="txnTags" placeholder="例: 外食, 旅行">
        </label>
        <div id="txnError" class="auth-error hidden" role="alert"></div>
        <div class="modal-actions">
          <button type="button" id="deleteTxnBtn" class="btn-danger hidden">削除</button>
          <div class="modal-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="authModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>ログイン</h2>
      <form id="authForm">
        <label>メールアドレス
          <input type="email" id="authEmail" required maxlength="255" autocomplete="username">
        </label>
        <label>パスワード
          <div class="password-field">
            <input type="password" id="authPassword" required maxlength="72" autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="authPassword" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <label>パスワード(確認)
          <div class="password-field">
            <input type="password" id="authPasswordConfirm" maxlength="72" autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="authPasswordConfirm" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <div id="authError" class="auth-error hidden"></div>
        <div class="modal-actions">
          <div class="modal-actions-right">
            <button type="button" id="authCancelBtn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">ログイン</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="registerModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>新規登録</h2>
      <form id="registerForm">
        <label>メールアドレス
          <input type="email" id="registerEmail" required maxlength="255" autocomplete="username">
        </label>
        <label>パスワード<span class="hint">(8文字以上)</span>
          <div class="password-field">
            <input type="password" id="registerPassword" required minlength="8" maxlength="72" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="registerPassword" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <label>パスワード(確認)
          <div class="password-field">
            <input type="password" id="registerPasswordConfirm" maxlength="72" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="registerPasswordConfirm" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <div id="registerError" class="auth-error hidden"></div>
        <div class="modal-actions">
          <div class="modal-actions-right">
            <button type="button" id="registerCancelBtn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">登録</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="accountModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>アカウント設定</h2>
      <form id="accountForm">
        <label>メールアドレス
          <input type="email" id="accountEmail" required maxlength="255" autocomplete="username">
        </label>
        <label>新しいパスワード<span class="hint">(変更する場合のみ)</span>
          <div class="password-field">
            <input type="password" id="accountNewPassword" maxlength="72" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="accountNewPassword" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <label>現在のパスワード<span class="required">*</span>
          <div class="password-field">
            <input type="password" id="accountCurrentPassword" required maxlength="72" autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="accountCurrentPassword" aria-label="パスワードを表示">👁</button>
          </div>
        </label>
        <div id="accountError" class="auth-error hidden"></div>
        <div class="modal-actions">
          <div class="modal-actions-right">
            <button type="button" id="accountCancelBtn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
