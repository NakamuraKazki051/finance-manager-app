services:
  db:
    image: postgres:16-alpine
    container_name: finance-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financemanager
      POSTGRES_USER: financemanager
      POSTGRES_PASSWORD: financemanager
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financemanager -d financemanager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
